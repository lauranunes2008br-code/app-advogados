<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Painel Administrativo | Josiane Nunes
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #f8f3eb;
            color: #3d2528;
            min-height: 100vh;
        }

        button,
        input,
        select {
            font-family: 'Montserrat', sans-serif;
        }

        .topo {
            background: #4b2028;
            color: white;
            padding: 18px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .logo-symbol {
            width: 45px;
            height: 45px;
            border: 1px solid #c9a66b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c9a66b;
            font-family: 'Cormorant Garamond', serif;
            font-size: 21px;
        }

        .logo h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 23px;
            letter-spacing: 1px;
        }

        .logo span {
            display: block;
            color: #d7bd8b;
            font-size: 9px;
            letter-spacing: 3px;
        }

        .btn-sair {
            border: 1px solid #c9a66b;
            background: transparent;
            color: white;
            padding: 9px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
        }

        .btn-sair:hover {
            background: #642d37;
        }

        main {
            max-width: 1250px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .login-container {
            max-width: 430px;
            margin: 80px auto;
        }

        .box {
            background: white;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 8px 35px rgba(75, 32, 40, .08);
        }

        .titulo {
            text-align: center;
            margin-bottom: 30px;
        }

        .titulo h2 {
            font-family: 'Cormorant Garamond', serif;
            color: #4b2028;
            font-size: 40px;
        }

        .titulo p {
            color: #756568;
            font-size: 12px;
            margin-top: 6px;
        }

        .campo {
            margin-bottom: 18px;
        }

        .campo label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #4b2028;
            margin-bottom: 7px;
        }

        .campo input,
        .campo select {
            width: 100%;
            border: 1px solid #ddd2c8;
            background: #fffdf9;
            padding: 13px;
            border-radius: 7px;
            outline: none;
            color: #3d2528;
        }

        .campo input:focus,
        .campo select:focus {
            border-color: #a78355;
        }

        .btn-principal {
            width: 100%;
            border: none;
            background: #4b2028;
            color: white;
            padding: 14px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-principal:hover {
            background: #642d37;
        }

        .btn-principal:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .link-esqueci {
            display: block;
            text-align: center;
            margin-top: 17px;
            color: #8b6c48;
            font-size: 11px;
            text-decoration: none;
        }

        .erro {
            display: none;
            background: #f8dddd;
            color: #7d2525;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 11px;
            line-height: 1.5;
        }

        .sucesso {
            display: none;
            background: #e8f2e9;
            color: #35633b;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 11px;
            line-height: 1.5;
        }

        .oculto {
            display: none !important;
        }

        .selecao {
            max-width: 700px;
            margin: 70px auto;
        }

        .advogados-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .advogado-card {
            background: white;
            border: 1px solid #eadfd4;
            border-radius: 10px;
            padding: 24px;
            cursor: pointer;
            transition: .25s;
        }

        .advogado-card:hover {
            border-color: #c9a66b;
            transform: translateY(-2px);
        }

        .advogado-card h3 {
            font-family: 'Cormorant Garamond', serif;
            color: #4b2028;
            font-size: 28px;
        }

        .advogado-card p {
            color: #756568;
            font-size: 11px;
            margin-top: 5px;
        }

        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            gap: 15px;
        }

        .dashboard-header h2 {
            font-family: 'Cormorant Garamond', serif;
            color: #4b2028;
            font-size: 42px;
        }

        .dashboard-header p {
            color: #756568;
            font-size: 12px;
        }

        .btn-secundario {
            background: transparent;
            border: 1px solid #a78355;
            color: #4b2028;
            padding: 11px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }

        .btn-secundario:hover {
            background: #4b2028;
            color: white;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .painel {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 35px rgba(75, 32, 40, .06);
        }

        .painel-titulo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid #eee5dc;
        }

        .painel-titulo h3 {
            font-family: 'Cormorant Garamond', serif;
            color: #4b2028;
            font-size: 30px;
        }

        .lista {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 650px;
            overflow-y: auto;
        }

        .item {
            border: 1px solid #e8ded5;
            border-radius: 8px;
            padding: 16px;
        }

        .item-topo {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .item h4 {
            color: #4b2028;
            font-size: 14px;
        }

        .item-data {
            color: #8b6c48;
            font-size: 11px;
            font-weight: 600;
            margin-top: 6px;
        }

        .item-info {
            color: #756568;
            font-size: 11px;
            line-height: 1.7;
            margin-top: 8px;
        }

        .status {
            padding: 5px 8px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 600;
            white-space: nowrap;
        }

        .status-pendente {
            background: #fff2d6;
            color: #8b6728;
        }

        .status-confirmado {
            background: #e5f1e7;
            color: #35633b;
        }

        .status-cancelado {
            background: #f8dddd;
            color: #7d2525;
        }

        .acoes {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 14px;
        }

        .btn-acao {
            border: none;
            padding: 8px 11px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 9px;
            font-weight: 600;
        }

        .btn-confirmar {
            background: #e5f1e7;
            color: #35633b;
        }

        .btn-cancelar {
            background: #f8dddd;
            color: #7d2525;
        }

        .btn-remarcar {
            background: #4b2028;
            color: white;
        }

        .btn-remarcar:hover {
            background: #642d37;
        }

        .vazio {
            text-align: center;
            padding: 35px 15px;
            color: #9a8b8e;
            font-size: 12px;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(35, 15, 19, .65);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 3000;
        }

        .modal.aberto {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .modal-header h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            color: #4b2028;
        }

        .fechar {
            width: 35px;
            height: 35px;
            border: none;
            background: #f8f3eb;
            color: #4b2028;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        .cliente-atual {
            background: #f8f3eb;
            border-left: 3px solid #c9a66b;
            padding: 13px;
            margin-bottom: 20px;
            font-size: 11px;
            line-height: 1.7;
            color: #66565a;
        }

        .modal-botoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-fechar {
            border: 1px solid #c9a66b;
            background: white;
            color: #4b2028;
            padding: 13px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-salvar {
            border: none;
            background: #4b2028;
            color: white;
            padding: 13px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-salvar:disabled {
            opacity: .6;
        }

        .carregando {
            text-align: center;
            color: #756568;
            padding: 20px;
            font-size: 11px;
        }

        @media(max-width:850px) {

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .advogados-grid {
                grid-template-columns: 1fr;
            }

        }

        @media(max-width:600px) {

            .topo {
                padding: 15px 5%;
            }

            .logo h1 {
                font-size: 19px;
            }

            main {
                padding: 0 14px;
            }

            .box,
            .painel {
                padding: 20px;
            }

            .dashboard-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .dashboard-header h2 {
                font-size: 35px;
            }

            .modal-box {
                padding: 22px;
            }

        }

    </style>

</head>

<body>

<header class="topo">

    <div class="logo">

        <div class="logo-symbol">
            JN
        </div>

        <div>
            <h1>JOSIANE NUNES</h1>
            <span>ADVOCACIA</span>
        </div>

    </div>

    <button
        class="btn-sair oculto"
        id="btnSair"
    >
        Sair
    </button>

</header>


<main>

    <!-- LOGIN -->

    <section
        id="loginPagina"
        class="login-container"
    >

        <div class="box">

            <div class="titulo">

                <h2>
                    Acesso
                </h2>

                <p>
                    Painel administrativo
                </p>

            </div>

            <div
                class="erro"
                id="erroLogin"
            ></div>

            <form id="loginForm">

                <div class="campo">

                    <label>
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="emailLogin"
                        required
                    >

                </div>

                <div class="campo">

                    <label>
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senhaLogin"
                        required
                    >

                </div>

                <button
                    class="btn-principal"
                    id="btnLogin"
                    type="submit"
                >
                    Entrar
                </button>

            </form>

            <a
                href="#"
                class="link-esqueci"
                id="esqueciSenha"
            >
                Esqueci minha senha
            </a>

        </div>

    </section>


    <!-- SELEÇÃO DO ADVOGADO -->

    <section
        id="selecaoPagina"
        class="selecao oculto"
    >

        <div class="box">

            <div class="titulo">

                <h2>
                    Selecionar advogado
                </h2>

                <p>
                    Escolha o profissional para acessar o painel.
                </p>

            </div>

            <div
                class="erro"
                id="erroSelecao"
            ></div>

            <div
                id="advogadosLista"
                class="advogados-grid"
            ></div>

        </div>

    </section>


    <!-- DASHBOARD -->

    <section
        id="dashboardPagina"
        class="oculto"
    >

        <div class="dashboard-header">

            <div>

                <h2>
                    Painel de atendimento
                </h2>

                <p id="nomeAdvogado"></p>

            </div>

            <button
                class="btn-secundario"
                id="btnVoltarSelecao"
            >
                Trocar advogado
            </button>

        </div>


        <div
            class="erro"
            id="erroDashboard"
        ></div>

        <div
            class="sucesso"
            id="sucessoDashboard"
        ></div>


        <div class="dashboard-grid">


            <!-- HORÁRIOS -->

            <div class="painel">

                <div class="painel-titulo">

                    <h3>
                        Horários
                    </h3>

                    <button
                        class="btn-secundario"
                        id="btnAtualizarHorarios"
                    >
                        Atualizar
                    </button>

                </div>

                <div
                    id="horariosLista"
                    class="lista"
                ></div>

            </div>


            <!-- AGENDAMENTOS -->

            <div class="painel">

                <div class="painel-titulo">

                    <h3>
                        Agendamentos
                    </h3>

                    <button
                        class="btn-secundario"
                        id="btnAtualizarAgendamentos"
                    >
                        Atualizar
                    </button>

                </div>

                <div
                    id="agendamentosLista"
                    class="lista"
                ></div>

            </div>


        </div>

    </section>

</main>


<!-- MODAL REMARCAÇÃO -->

<div
    class="modal"
    id="modalRemarcacao"
>

    <div class="modal-box">

        <div class="modal-header">

            <h3>
                Remarcar atendimento
            </h3>

            <button
                class="fechar"
                id="fecharModal"
            >
                ×
            </button>

        </div>


        <div
            class="cliente-atual"
            id="clienteAtual"
        ></div>


        <div
            class="erro"
            id="erroRemarcacao"
        ></div>


        <div class="campo">

            <label>
                Nova data
            </label>

            <input
                type="date"
                id="novaData"
            >

        </div>


        <div class="campo">

            <label>
                Novo horário
            </label>

            <select
                id="novoHorario"
                disabled
            >

                <option value="">
                    Primeiro selecione uma data
                </option>

            </select>

        </div>


        <div class="modal-botoes">

            <button
                class="btn-fechar"
                id="btnCancelarModal"
            >
                Cancelar
            </button>

            <button
                class="btn-salvar"
                id="btnSalvarRemarcacao"
            >
                Salvar remarcação
            </button>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ovogpczsnxwqmefpbydi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_BpWlUOmryWU2tSxMNg4fQQ_aCJbWpEN";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


let usuarioAtual =
    null;

let advogadoSelecionado =
    null;

let agendamentoSelecionado =
    null;


/* ELEMENTOS */

const loginPagina =
    document.getElementById("loginPagina");

const selecaoPagina =
    document.getElementById("selecaoPagina");

const dashboardPagina =
    document.getElementById("dashboardPagina");

const btnSair =
    document.getElementById("btnSair");


/* ERRO */

function mostrarErro(elemento, mensagem) {

    elemento.textContent =
        mensagem;

    elemento.style.display =
        "block";

}


function esconderErro(elemento) {

    elemento.style.display =
        "none";

}


/* SUCESSO */

function mostrarSucesso(mensagem) {

    const elemento =
        document.getElementById(
            "sucessoDashboard"
        );

    elemento.textContent =
        mensagem;

    elemento.style.display =
        "block";

    setTimeout(
        () => {
            elemento.style.display =
                "none";
        },
        5000
    );

}


/* DATA */

function formatarData(data) {

    if (!data) {
        return "";
    }

    const partes =
        data.split("-");

    if (partes.length !== 3) {
        return data;
    }

    return `${partes[2]}/${partes[1]}/${partes[0]}`;

}


/* STATUS */

function classeStatus(status) {

    const valor =
        String(status || "")
            .toLowerCase();

    if (
        valor === "confirmado" ||
        valor === "aceito"
    ) {

        return "status-confirmado";

    }

    if (
        valor === "cancelado" ||
        valor === "recusado"
    ) {

        return "status-cancelado";

    }

    return "status-pendente";

}


function textoStatus(status) {

    if (!status) {
        return "Pendente";
    }

    const valor =
        String(status).toLowerCase();

    if (valor === "confirmado") {
        return "Confirmado";
    }

    if (valor === "aceito") {
        return "Confirmado";
    }

    if (valor === "cancelado") {
        return "Cancelado";
    }

    if (valor === "recusado") {
        return "Recusado";
    }

    return "Pendente";

}


/* LOGIN */

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const erro =
                document.getElementById(
                    "erroLogin"
                );

            esconderErro(erro);

            const email =
                document
                    .getElementById("emailLogin")
                    .value
                    .trim();

            const senha =
                document
                    .getElementById("senhaLogin")
                    .value;

            const botao =
                document
                    .getElementById("btnLogin");

            botao.disabled =
                true;

            botao.textContent =
                "Entrando...";


            try {

                const resultado =
                    await supabaseClient.auth
                        .signInWithPassword({
                            email,
                            password: senha
                        });


                if (resultado.error) {
                    throw resultado.error;
                }


                usuarioAtual =
                    resultado.data.user;


                await carregarAdvogados();


                loginPagina
                    .classList
                    .add("oculto");

                selecaoPagina
                    .classList
                    .remove("oculto");

                btnSair
                    .classList
                    .remove("oculto");


            } catch (error) {

                console.error(error);

                mostrarErro(
                    erro,
                    error.message ||
                    "Não foi possível entrar."
                );

            } finally {

                botao.disabled =
                    false;

                botao.textContent =
                    "Entrar";

            }

        }
    );


/* ADVOGADOS */

async function carregarAdvogados() {

    const lista =
        document.getElementById(
            "advogadosLista"
        );

    const erro =
        document.getElementById(
            "erroSelecao"
        );

    esconderErro(erro);

    lista.innerHTML =
        '<div class="carregando">Carregando...</div>';


    try {

        const { data, error } =
            await supabaseClient
                .from("advogados")
                .select("*")
                .eq("ativo", true)
                .order("nome");


        if (error) {
            throw error;
        }


        if (!data || data.length === 0) {

            lista.innerHTML =
                '<div class="vazio">Nenhum advogado disponível.</div>';

            return;
        }


        lista.innerHTML = "";


        data.forEach(
            advogado => {

                const card =
                    document.createElement("div");

                card.className =
                    "advogado-card";

                card.innerHTML = `
                    <h3>${escaparHTML(advogado.nome || "Advogado")}</h3>
                    <p>Acessar painel de atendimento</p>
                `;

                card.addEventListener(
                    "click",
                    () => selecionarAdvogado(advogado)
                );

                lista.appendChild(card);

            }
        );


    } catch (error) {

        console.error(error);

        mostrarErro(
            erro,
            "Não foi possível carregar os advogados."
        );

        lista.innerHTML = "";

    }

}


/* SELECIONAR ADVOGADO */

async function selecionarAdvogado(advogado) {

    advogadoSelecionado =
        advogado;

    selecaoPagina
        .classList
        .add("oculto");

    dashboardPagina
        .classList
        .remove("oculto");

    document
        .getElementById("nomeAdvogado")
        .textContent =
        advogado.nome || "";


    await carregarDashboard();

}


/* DASHBOARD */

async function carregarDashboard() {

    await Promise.all([
        carregarHorarios(),
        carregarAgendamentos()
    ]);

}


/* HORÁRIOS */

async function carregarHorarios() {

    const lista =
        document.getElementById(
            "horariosLista"
        );

    lista.innerHTML =
        '<div class="carregando">Carregando horários...</div>';


    try {

        const { data, error } =
            await supabaseClient
                .from("horarios")
                .select("*")
                .eq(
                    "advogado_id",
                    advogadoSelecionado.id
                )
                .order("data")
                .order("horario");


        if (error) {
            throw error;
        }


        if (!data || data.length === 0) {

            lista.innerHTML =
                '<div class="vazio">Nenhum horário cadastrado.</div>';

            return;
        }


        lista.innerHTML = "";


        data.forEach(
            horario => {

                const item =
                    document.createElement("div");

                item.className =
                    "item";

                const disponivel =
                    horario.disponivel === true;


                item.innerHTML = `

                    <div class="item-topo">

                        <div>

                            <h4>
                                ${formatarData(horario.data)}
                            </h4>

                            <div class="item-data">
                                ${String(horario.horario || "").substring(0,5)}
                            </div>

                        </div>

                        <span class="status ${
                            disponivel
                            ? "status-confirmado"
                            : "status-cancelado"
                        }">

                            ${
                                disponivel
                                ? "Disponível"
                                : "Ocupado"
                            }

                        </span>

                    </div>

                `;

                lista.appendChild(item);

            }
        );


    } catch (error) {

        console.error(error);

        lista.innerHTML =
            '<div class="vazio">Erro ao carregar horários.</div>';

    }

}


/* AGENDAMENTOS */

async function carregarAgendamentos() {

    const lista =
        document.getElementById(
            "agendamentosLista"
        );

    lista.innerHTML =
        '<div class="carregando">Carregando agendamentos...</div>';


    try {

        const { data, error } =
            await supabaseClient
                .from("agendamentos")
                .select("*")
                .eq(
                    "advogado_id",
                    advogadoSelecionado.id
                )
                .order("data")
                .order("horario");


        if (error) {
            throw error;
        }


        if (!data || data.length === 0) {

            lista.innerHTML =
                '<div class="vazio">Nenhum agendamento encontrado.</div>';

            return;
        }


        lista.innerHTML = "";


        data.forEach(
            agendamento => {

                const item =
                    document.createElement("div");

                item.className =
                    "item";


                const status =
                    agendamento.status ||
                    "pendente";


                const podeRemarcar =
                    status !== "cancelado" &&
                    status !== "recusado";


                let botoes = "";


                if (
                    status === "pendente"
                ) {

                    botoes += `

                        <button
                            class="btn-acao btn-confirmar"
                            onclick="alterarStatus('${agendamento.id}', 'confirmado')"
                        >
                            ACEITAR
                        </button>

                        <button
                            class="btn-acao btn-cancelar"
                            onclick="alterarStatus('${agendamento.id}', 'cancelado')"
                        >
                            RECUSAR
                        </button>

                    `;

                }


                if (podeRemarcar) {

                    botoes += `

                        <button
                            class="btn-acao btn-remarcar"
                            onclick="abrirRemarcacao('${agendamento.id}')"
                        >
                            REMARCAR
                        </button>

                    `;

                }


                item.innerHTML = `

                    <div class="item-topo">

                        <div>

                            <h4>
                                ${escaparHTML(
                                    agendamento.nome ||
                                    "Cliente"
                                )}
                            </h4>

                            <div class="item-data">

                                ${formatarData(
                                    agendamento.data
                                )}

                                às

                                ${String(
                                    agendamento.horario || ""
                                ).substring(0,5)}

                            </div>

                        </div>

                        <span class="status ${
                            classeStatus(status)
                        }">

                            ${textoStatus(status)}

                        </span>

                    </div>


                    <div class="item-info">

                        <strong>Telefone:</strong>
                        ${escaparHTML(
                            agendamento.telefone || "-"
                        )}

                        <br>

                        <strong>E-mail:</strong>
                        ${escaparHTML(
                            agendamento.email || "-"
                        )}

                        <br>

                        <strong>Atendimento:</strong>
                        ${escaparHTML(
                            agendamento.tipo_atendimento || "-"
                        )}

                        <br>

                        <strong>Área:</strong>
                        ${escaparHTML(
                            agendamento.area || "-"
                        )}

                        ${
                            agendamento.assunto
                            ? `
                                <br>
                                <strong>Assunto:</strong>
                                ${escaparHTML(
                                    agendamento.assunto
                                )}
                              `
                            : ""
                        }

                    </div>


                    <div class="acoes">

                        ${botoes}

                    </div>

                `;


                lista.appendChild(item);

            }
        );


    } catch (error) {

        console.error(error);

        lista.innerHTML =
            '<div class="vazio">Erro ao carregar agendamentos.</div>';

    }

}


/* ALTERAR STATUS */

async function alterarStatus(
    id,
    novoStatus
) {

    const confirmar =
        novoStatus === "confirmado"
        ? "Deseja confirmar este agendamento?"
        : "Deseja recusar este agendamento?";


    if (!window.confirm(confirmar)) {
        return;
    }


    try {

        const { error } =
            await supabaseClient
                .from("agendamentos")
                .update({
                    status: novoStatus
                })
                .eq("id", id)
                .eq(
                    "advogado_id",
                    advogadoSelecionado.id
                );


        if (error) {
            throw error;
        }


        mostrarSucesso(
            novoStatus === "confirmado"
            ? "Agendamento confirmado."
            : "Agendamento recusado."
        );


        await carregarAgendamentos();


    } catch (error) {

        console.error(error);

        mostrarErro(
            document.getElementById(
                "erroDashboard"
            ),
            error.message ||
            "Não foi possível alterar o agendamento."
        );

    }

}


/* ABRIR REMARCAÇÃO */

async function abrirRemarcacao(id) {

    try {

        const { data, error } =
            await supabaseClient
                .from("agendamentos")
                .select("*")
                .eq("id", id)
                .eq(
                    "advogado_id",
                    advogadoSelecionado.id
                )
                .single();


        if (error) {
            throw error;
        }


        agendamentoSelecionado =
            data;


        document
            .getElementById("clienteAtual")
            .innerHTML = `

                <strong>
                    Cliente:
                </strong>

                ${escaparHTML(
                    data.nome || "-"
                )}

                <br>

                <strong>
                    Data atual:
                </strong>

                ${formatarData(
                    data.data
                )}

                às

                ${String(
                    data.horario || ""
                ).substring(0,5)}

            `;


        const novaData =
            document.getElementById(
                "novaData"
            );


        const hoje =
            new Date();

        const ano =
            hoje.getFullYear();

        const mes =
            String(
                hoje.getMonth() + 1
            ).padStart(2, "0");

        const dia =
            String(
                hoje.getDate()
            ).padStart(2, "0");


        novaData.min =
            `${ano}-${mes}-${dia}`;


        novaData.value = "";


        document
            .getElementById("novoHorario")
            .innerHTML =
            '<option value="">Primeiro selecione uma data</option>';


        document
            .getElementById("novoHorario")
            .disabled =
            true;


        esconderErro(
            document.getElementById(
                "erroRemarcacao"
            )
        );


        document
            .getElementById("modalRemarcacao")
            .classList
            .add("aberto");


    } catch (error) {

        console.error(error);

        mostrarErro(
            document.getElementById(
                "erroDashboard"
            ),
            "Não foi possível abrir a remarcação."
        );

    }

}


/* BUSCAR NOVOS HORÁRIOS */

document
    .getElementById("novaData")
    .addEventListener(
        "change",
        async function() {

            const data =
                this.value;

            const select =
                document.getElementById(
                    "novoHorario"
                );

            const erro =
                document.getElementById(
                    "erroRemarcacao"
                );


            esconderErro(erro);


            select.innerHTML =
                '<option value="">Carregando horários...</option>';

            select.disabled =
                true;


            if (!data) {

                select.innerHTML =
                    '<option value="">Primeiro selecione uma data</option>';

                return;

            }


            const dataObj =
                new Date(
                    data + "T00:00:00"
                );


            if (dataObj.getDay() === 0) {

                select.innerHTML =
                    '<option value="">Não atendemos aos domingos</option>';

                return;

            }


            try {

                const { data: horarios, error } =
                    await supabaseClient
                        .from("horarios")
                        .select("*")
                        .eq(
                            "advogado_id",
                            advogadoSelecionado.id
                        )
                        .eq(
                            "data",
                            data
                        )
                        .eq(
                            "disponivel",
                            true
                        )
                        .order("horario");


                if (error) {
                    throw error;
                }


                select.innerHTML =
                    '<option value="">Selecione o novo horário</option>';


                if (!horarios || horarios.length === 0) {

                    select.innerHTML =
                        '<option value="">Nenhum horário disponível</option>';

                    return;

                }


                horarios.forEach(
                    horario => {

                        /*
                         * Se for a mesma data do agendamento,
                         * não oferecemos o horário atual como
                         * "novo" horário.
                         */

                        if (
                            data ===
                            agendamentoSelecionado.data &&
                            horario.horario ===
                            agendamentoSelecionado.horario
                        ) {
                            return;
                        }


                        const option =
                            document.createElement(
                                "option"
                            );

                        option.value =
                            horario.horario;

                        option.textContent =
                            String(
                                horario.horario
                            ).substring(0,5);

                        select.appendChild(
                            option
                        );

                    }
                );


                if (select.options.length <= 1) {

                    select.innerHTML =
                        '<option value="">Nenhum outro horário disponível</option>';

                    return;

                }


                select.disabled =
                    false;


            } catch (error) {

                console.error(error);

                mostrarErro(
                    erro,
                    "Não foi possível carregar os novos horários."
                );

                select.innerHTML =
                    '<option value="">Erro ao carregar horários</option>';

            }

        }
    );


/* SALVAR REMARCAÇÃO */

document
    .getElementById("btnSalvarRemarcacao")
    .addEventListener(
        "click",
        async function() {

            const erro =
                document.getElementById(
                    "erroRemarcacao"
                );

            esconderErro(erro);


            if (!agendamentoSelecionado) {

                mostrarErro(
                    erro,
                    "Nenhum agendamento selecionado."
                );

                return;

            }


            const novaData =
                document
                    .getElementById("novaData")
                    .value;


            const novoHorario =
                document
                    .getElementById("novoHorario")
                    .value;


            if (!novaData || !novoHorario) {

                mostrarErro(
                    erro,
                    "Escolha a nova data e o novo horário."
                );

                return;

            }


            const botao =
                document.getElementById(
                    "btnSalvarRemarcacao"
                );


            botao.disabled =
                true;

            botao.textContent =
                "Salvando...";


            try {

                /*
                 * Verificação final.
                 */

                const { data: disponiveis, error: erroBusca } =
                    await supabaseClient
                        .from("horarios")
                        .select("*")
                        .eq(
                            "advogado_id",
                            advogadoSelecionado.id
                        )
                        .eq(
                            "data",
                            novaData
                        )
                        .eq(
                            "horario",
                            novoHorario
                        )
                        .eq(
                            "disponivel",
                            true
                        );


                if (erroBusca) {
                    throw erroBusca;
                }


                if (
                    !disponiveis ||
                    disponiveis.length === 0
                ) {

                    throw new Error(
                        "Esse novo horário acabou de ser ocupado. Escolha outro."
                    );

                }


                /*
                 * Atualiza o agendamento.
                 */

                const { error: erroAgendamento } =
                    await supabaseClient
                        .from("agendamentos")
                        .update({

                            data:
                                novaData,

                            horario:
                                novoHorario

                        })
                        .eq(
                            "id",
                            agendamentoSelecionado.id
                        )
                        .eq(
                            "advogado_id",
                            advogadoSelecionado.id
                        );


                if (erroAgendamento) {
                    throw erroAgendamento;
                }


                /*
                 * Libera o horário antigo.
                 */

                const { error: erroHorarioAntigo } =
                    await supabaseClient
                        .from("horarios")
                        .update({
                            disponivel: true
                        })
                        .eq(
                            "advogado_id",
                            advogadoSelecionado.advogado_id ||
                            advogadoSelecionado.id
                        )
                        .eq(
                            "data",
                            agendamentoSelecionado.data
                        )
                        .eq(
                            "horario",
                            agendamentoSelecionado.horario
                        );


                if (erroHorarioAntigo) {

                    console.error(
                        "Erro ao liberar horário antigo:",
                        erroHorarioAntigo
                    );

                }


                /*
                 * Ocupa o novo horário.
                 */

                const { error: erroNovoHorario } =
                    await supabaseClient
                        .from("horarios")
                        .update({
                            disponivel: false
                        })
                        .eq(
                            "advogado_id",
                            advogadoSelecionado.id
                        )
                        .eq(
                            "data",
                            novaData
                        )
                        .eq(
                            "horario",
                            novoHorario
                        );


                if (erroNovoHorario) {
                    throw erroNovoHorario;
                }


                fecharModal();


                mostrarSucesso(
                    "Agendamento remarcado com sucesso."
                );


                await carregarDashboard();


            } catch (error) {

                console.error(error);

                mostrarErro(
                    erro,
                    error.message ||
                    "Não foi possível remarcar o atendimento."
                );

            } finally {

                botao.disabled =
                    false;

                botao.textContent =
                    "Salvar remarcação";

            }

        }
    );


/* FECHAR MODAL */

function fecharModal() {

    document
        .getElementById("modalRemarcacao")
        .classList
        .remove("aberto");

    agendamentoSelecionado =
        null;

}


document
    .getElementById("fecharModal")
    .addEventListener(
        "click",
        fecharModal
    );


document
    .getElementById("btnCancelarModal")
    .addEventListener(
        "click",
        fecharModal
    );


document
    .getElementById("modalRemarcacao")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {
                fecharModal();
            }

        }
    );


/* ATUALIZAR */

document
    .getElementById("btnAtualizarHorarios")
    .addEventListener(
        "click",
        carregarHorarios
    );


document
    .getElementById("btnAtualizarAgendamentos")
    .addEventListener(
        "click",
        carregarAgendamentos
    );


/* TROCAR ADVOGADO */

document
    .getElementById("btnVoltarSelecao")
    .addEventListener(
        "click",
        function() {

            advogadoSelecionado =
                null;

            dashboardPagina
                .classList
                .add("oculto");

            selecaoPagina
                .classList
                .remove("oculto");

    );


/* SAIR */

btnSair.addEventListener(
    "click",
    async function() {

        await supabaseClient.auth.signOut();

        usuarioAtual =
            null;

        advogadoSelecionado =
            null;

        dashboardPagina
            .classList
            .add("oculto");

        selecaoPagina
            .classList
            .add("oculto");

        loginPagina
            .classList
            .remove("oculto");

        btnSair
            .classList
            .add("oculto");

    }
);


/* RECUPERAR SENHA */

document
    .getElementById("esqueciSenha")
    .addEventListener(
        "click",
        async function(event) {

            event.preventDefault();

            const email =
                document
                    .getElementById("emailLogin")
                    .value
                    .trim();

            const erro =
                document.getElementById(
                    "erroLogin"
                );


            if (!email) {

                mostrarErro(
                    erro,
                    "Digite seu e-mail primeiro."
                );

                return;

            }


            try {

                const { error } =
                    await supabaseClient.auth
                        .resetPasswordForEmail(
                            email,
                            {
                                redirectTo:
                                    window.location.href
                            }
                        );


                if (error) {
                    throw error;
                }


                mostrarErro(
                    erro,
                    "Se o e-mail estiver cadastrado, você receberá as instruções para redefinir a senha."
                );

            } catch (error) {

                mostrarErro(
                    erro,
                    error.message ||
                    "Não foi possível solicitar a recuperação."
                );

            }

        }
    );


/* SEGURANÇA */

function escaparHTML(valor) {

    return String(valor ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* VERIFICAR SESSÃO */

(async function() {

    try {

        const {
            data
        } =
            await supabaseClient.auth
                .getSession();


        if (
            data &&
            data.session &&
            data.session.user
        ) {

            usuarioAtual =
                data.session.user;

            await carregarAdvogados();

            loginPagina
                .classList
                .add("oculto");

            selecaoPagina
                .classList
                .remove("oculto");

            btnSair
                .classList
                .remove("oculto");

        }

    } catch (error) {

        console.error(error);

    }

})();

</script>
